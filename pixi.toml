[workspace]
name = "slocum"
version = "0.1.3"
description = "Slocum -- A tool for getting smaller better forecasts to sailors"
authors = ["Alex Kleeman <akleeman@gmail.com>", "Markus Schweitzer"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.20,<2"
scipy = ">=1.7"
xarray = ">=2022.3"
pyproj = ">=3.0"
pandas = ">=1.3"
matplotlib = ">=3.5"
joblib = ">=1.0"
requests = ">=2.25"
netcdf4 = ">=1.5"
cartopy = ">=0.20"
basemap = "*"
retrying = ">=1.3"
cftime = ">=1.5"
zarr = ">=2.10"
gcsfs = ">=2025.10.0,<2026"
arraylake = "*"
ipdb = "*"
dask = "*"
fastapi = ">=0.115"
uvicorn = ">=0.32"
httpx = ">=0.28"
pytest-asyncio = ">=0.24"
nodejs = ">=20,<21"

[tasks]
install-dev = "pip install -e ."
spot-forecast = { cmd = "python generate_spot_forecast.py", depends-on = ["install-dev"] }
map-forecast = { cmd = "python generate_map_forecast.py", depends-on = ["install-dev"] }
subset-forecasts = { cmd = "python subset_ensemble_forecasts.py", depends-on = ["install-dev"] }
spot-from-ensemble = { cmd = "python spot_forecast_from_ensemble.py", depends-on = ["install-dev"] }
test = { cmd = "pytest test/ -v", depends-on = ["install-dev"] }
test-coverage = { cmd = "pytest test/ -v --cov=slocum --cov-report=term-missing", depends-on = ["install-dev"] }
api-runtime-deps = "python -m pip install \"icechunk==0.2.18\" \"zarr>=3,<4\""
api-dev = { cmd = "uvicorn slocum_api.main:app --reload --app-dir apps/api" }
api-test = { cmd = "pytest apps/api/tests -v" }
web-install = "npm --prefix apps/web install"
web-dev = "npm --prefix apps/web run dev"
web-test = "npm --prefix apps/web run test -- --run"
web-e2e = "npm --prefix apps/web run test:e2e"
web-build = "npm --prefix apps/web run build"
cache-example-forecast = "python scripts/cache_example_forecast.py"
dev-local = { cmd = "bash scripts/dev_local.sh" }
api-bench = { cmd = "python apps/api/bench/benchmark_tiles.py" }

[feature.dev.dependencies]
pytest = ">=7.0"
pytest-xdist = ">=2.5"
pytest-cov = ">=3.0"
pip = "*"

[environments]
default = { features = ["dev"], solve-group = "default" }

